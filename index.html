<!doctype html>
<html lang="zh">
  <head>
    <meta name="game-uuid" content="ec4c882a-1305-4c62-8f52-129054301b45" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#070812" />
    <meta name="description" content="用指尖编织一颗会共振的虹彩纤维星体。" />
    <title>脉冲星绒 · Pulse Pelt</title>
    <style id="alteru-long-press-guard">html,body,#app,#root{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}input,textarea,[contenteditable="true"]{-webkit-touch-callout:default;-webkit-user-select:text;user-select:text}img,svg,canvas{-webkit-user-drag:none}</style>
    <style>
      :root{color-scheme:dark;background:#070812}
      *{box-sizing:border-box}
      html,body,#app{width:100%;height:100%;margin:0;overflow:hidden;background:#070812}
      .pp-critical{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,#1c2450 0,#0d1023 34%,#070812 72%);display:grid;place-items:center;color:#f4f3ff;font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
      .pp-critical__orb{width:min(62vw,250px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 36% 30%,#8ff8ff 0,#6e6bd2 18%,#242b58 52%,#0b0d1b 76%);box-shadow:0 0 50px rgba(103,244,255,.18),inset -18px -24px 44px rgba(0,0,0,.46);position:relative}
      .pp-critical__orb:after{content:"";position:absolute;inset:-12%;border:1px solid rgba(166,140,255,.22);border-radius:50%;animation:pp-critical-breathe 2.8s ease-in-out infinite}
      @keyframes pp-critical-breathe{50%{transform:scale(1.07);opacity:.38}}
    </style>
    <script src="https://images.aiwaves.tech/alteru/guest-shell.js" defer></script>
  </head>
  <body>
    <div id="app">
      <div class="pp-critical" aria-hidden="true">
        <div class="pp-critical__orb"></div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
